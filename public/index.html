<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeviceInfo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%A5%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div class="app__title">
          <span class="app__logo">🖥️</span>
          <div>
            <h1>DeviceInfo</h1>
            <p class="app__subtitle">Live system &amp; device information</p>
          </div>
        </div>
        <div class="app__controls">
          <span id="status" class="status status--loading">Loading…</span>
          <button id="refresh" class="btn" type="button">Refresh</button>
        </div>
      </header>

      <main id="grid" class="grid" aria-live="polite"></main>

      <footer class="app__footer">
        <span id="updated">—</span>
        <label class="toggle">
          <input id="auto" type="checkbox" checked />
          Auto-refresh (5s)
        </label>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
